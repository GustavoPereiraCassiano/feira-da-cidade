{% extends "base.html" %}{% block content %}<h1 class="h3 mb-4">Conversas dos seus anúncios</h1>{% if conversations %}<div class="list-group">{% for c in conversations %}<a class="list-group-item list-group-item-action" href="{{ url_for('chat.room', conversation_id=c.id) }}"><strong>{{ c.buyer_name }}</strong> — {{ c.ad.title }}<small class="d-block text-muted">{{ c.created_at.strftime('%d/%m/%Y %H:%M') }}</small></a>{% endfor %}</div>{% else %}<p>Você ainda não recebeu conversas.</p>{% endif %}{% endblock %}
