{% extends "base.html" %}{% block content %}<h1 class="h3 mb-4">Moderação de anúncios</h1><div class="table-responsive"><table class="table align-middle"><tr><th>Produto</th><th>Vendedor</th><th>Status</th><th></th></tr>{% for ad in ads %}<tr><td>{{ ad.title }}</td><td>{{ ad.seller.name }}</td><td>{{ ad.status }}</td><td>{% if ad.status == 'active' %}<form method="post" action="{{ url_for('admin.moderate_remove', ad_id=ad.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Remover</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
