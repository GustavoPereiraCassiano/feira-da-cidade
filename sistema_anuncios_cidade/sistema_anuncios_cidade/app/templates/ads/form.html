{% extends "base.html" %}{% block content %}<div class="form-card wide"><h1 class="h3">{{ 'Editar anúncio' if ad else 'Anunciar produto' }}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Título</label><input class="form-control mb-3" name="title" maxlength="140" required value="{{ ad.title if ad else '' }}"><label class="form-label">Descrição</label><textarea class="form-control mb-3" name="description" rows="4" required>{{ ad.description if ad else '' }}</textarea><div class="row"><div class="col-md-6"><label class="form-label">Preço (R$)</label><input class="form-control mb-3" name="price" type="number" min="0" step="0.01" required value="{{ ad.price if ad else '' }}"></div><div class="col-md-6"><label class="form-label">Categoria</label><select class="form-select mb-3" name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if ad and ad.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div></div>{% if not ad %}<label class="form-label">Fotos (ao menos uma)</label><input class="form-control mb-3" type="file" name="photos" accept="image/jpeg,image/png,image/webp" multiple required><label class="form-label">Vídeo (opcional)</label><input class="form-control mb-3" type="file" name="video" accept="video/mp4,video/webm">{% endif %}<button class="btn btn-primary">Salvar anúncio</button></form></div>{% endblock %}
