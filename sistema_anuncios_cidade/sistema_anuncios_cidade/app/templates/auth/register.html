{% extends "base.html" %}{% block content %}<div class="form-card"><h1 class="h3">Cadastro de vendedor</h1><p class="text-muted">Crie sua conta para publicar e gerenciar anúncios.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Nome</label><input class="form-control mb-3" name="name" required maxlength="100"><label class="form-label">Telefone</label><input class="form-control mb-3" name="phone" required><label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Senha (mínimo 8 caracteres)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Criar conta</button></form></div>{% endblock %}
