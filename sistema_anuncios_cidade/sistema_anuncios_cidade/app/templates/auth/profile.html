{% extends "base.html" %}{% block content %}<div class="form-card"><h1 class="h3">Meu perfil</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Nome</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label class="form-label">Telefone</label><input class="form-control mb-3" name="phone" value="{{ current_user.phone }}" required><label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" value="{{ current_user.email }}" required><label class="form-label">Nova senha (opcional)</label><input class="form-control mb-3" type="password" name="password" minlength="8"><button class="btn btn-primary">Salvar alterações</button></form></div>{% endblock %}
